<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#12141b" />
<title>재무위험관리사 합격 플래너 v6</title>
<style>
:root {
  --bg:#f5f6fa; --card:#ffffff; --card2:#f0f2f7; --text:#111521; --muted:#6e7483; --line:#e3e6ef;
  --primary:#6d5dfc; --primary2:#9a8cff; --success:#18a058; --warning:#f59e0b; --danger:#ef4444;
  --shadow:0 18px 44px rgba(22,26,36,.10); --radius:24px;
}
[data-theme="dark"] {
  --bg:#0f1117; --card:#171a23; --card2:#202431; --text:#f4f6fb; --muted:#9ba3b5; --line:#2a3040;
  --primary:#8b7cff; --primary2:#b2a7ff; --success:#4ade80; --warning:#fbbf24; --danger:#fb7185;
  --shadow:0 18px 44px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Apple SD Gothic Neo",Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh}
button,input,select,textarea{font-family:inherit;color:inherit}
.app{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;background:linear-gradient(180deg,rgba(109,93,252,.10),transparent 280px),var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom));}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .kicker{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
h1{font-size:23px;line-height:1.12;margin:0;font-weight:900;letter-spacing:-.045em}
.iconBtn{border:1px solid var(--line);background:rgba(255,255,255,.04);width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:18px;box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0;overflow:hidden}
.card.soft{background:var(--card2);box-shadow:none}
.hero{padding:18px;background:linear-gradient(135deg,rgba(109,93,252,.92),rgba(47,139,255,.82));color:white;border:0;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;right:-42px;top:-42px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13)}
.heroTop{position:relative;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.heroTitle{font-size:13px;opacity:.82;font-weight:800}
.dday{font-size:34px;font-weight:950;letter-spacing:-.055em;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:800;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:10px}
.stat b{display:block;font-size:18px;letter-spacing:-.03em}
.stat span{display:block;margin-top:2px;font-size:11px;opacity:.8;font-weight:700}
.progressWrap{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:82px;height:82px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:0 0 82px;position:relative;overflow:hidden}
.ring:before{content:"";width:64px;height:64px;border-radius:50%;background:var(--card);grid-area:1/1}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:950;font-size:17px;line-height:1;z-index:2;text-align:center}
.progressText{min-width:0;flex:1}
.progressText .title{font-weight:900;font-size:17px;letter-spacing:-.03em}
.progressText .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px;width:0%}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sectionTitle h2{margin:0;font-size:17px;letter-spacing:-.035em}
.sectionTitle span{font-size:12px;color:var(--muted);font-weight:800}
.todayList{display:flex;flex-direction:column;gap:10px}
.todoGroupTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 2px;color:var(--muted);font-size:12px;font-weight:950;letter-spacing:-.02em}
.todoGroupTitle b{font-size:13px;color:var(--text)}
.inlineBtn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:950;white-space:nowrap}
.overdueNotice{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.09)}
.lectureCard{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:13px;display:flex;gap:12px;align-items:flex-start}
.lectureCard.done{opacity:.48}
.check{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;flex:0 0 auto;font-weight:950}
.lectureCard.done .check{background:var(--success);color:#07100a;border-color:transparent}
.lectureInfo{flex:1;min-width:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;color:var(--muted)}
.lectureTitle{font-size:14px;font-weight:900;line-height:1.35;letter-spacing:-.02em}
.lectureSub{font-size:11px;color:var(--muted);font-weight:750;margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;line-height:1.55;font-size:14px}
.warning{display:flex;gap:10px;align-items:flex-start;border-radius:20px;padding:13px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.45}
.warning strong{display:block;margin-bottom:3px}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(20,22,30,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.09);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:50}
[data-theme="light"] .tabs{background:rgba(255,255,255,.86);border-top:1px solid var(--line)}
.tabBtn{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:8px 3px 6px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.tabBtn .ico{font-size:18px;line-height:1}
.tabBtn.active{background:rgba(109,93,252,.16);color:var(--primary)}
.screen{display:none}
.screen.active{display:block}
.phaseList{display:grid;gap:8px}
.phase{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:18px;padding:11px;background:var(--card)}
.phase .dot{width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted)}
.phase.active{border-color:rgba(109,93,252,.55);background:rgba(109,93,252,.11)}
.phase.active .dot{background:var(--primary);color:white}
.phase.done .dot{background:var(--success);color:#07100a}
.phase b{font-size:13px}
.phase small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.segment{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:4px;gap:4px;margin:10px 0}
.segment button{flex:1;border:0;border-radius:14px;background:transparent;padding:10px 6px;font-size:12px;font-weight:900;color:var(--muted)}
.segment button.active{background:var(--card);color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.planDay{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:10px 0}
.planHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.planDate{font-size:14px;font-weight:950}
.planCount{font-size:11px;color:var(--muted);font-weight:900}
.dayOff{border-style:dashed;opacity:.70}
.miniLecture{display:flex;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.miniLecture:first-of-type{border-top:0}
.miniTitle{font-size:13px;font-weight:850;line-height:1.35;flex:1}
.miniMeta{font-size:10px;color:var(--muted);font-weight:800}
.toolbar{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;color:var(--muted);white-space:nowrap}
.chip.active{background:var(--primary);border-color:var(--primary);color:white}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px 14px;font-size:14px;outline:none;margin:8px 0 12px}
.accordion{border:1px solid var(--line);background:var(--card);border-radius:22px;overflow:hidden;margin:10px 0}
.accHead{width:100%;border:0;background:transparent;padding:14px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.accHead b{font-size:14px}
.accHead span{font-size:11px;color:var(--muted);font-weight:900}
.accBody{display:none;padding:0 10px 10px}
.accordion.open .accBody{display:block}
.subjectBars{display:grid;gap:12px}
.subjectRow{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:13px}
.subjectTop{display:flex;justify-content:space-between;font-size:13px;font-weight:900}
.graph{display:flex;align-items:end;gap:7px;height:92px;padding:8px 4px 0}
.gbar{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--primary2),var(--primary));min-height:4px;position:relative}
.gbar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);font-weight:800}
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px}
.cell{aspect-ratio:1/1;border-radius:5px;background:var(--card2);border:1px solid var(--line)}
.cell.l1{background:rgba(109,93,252,.30)}.cell.l2{background:rgba(109,93,252,.55)}.cell.l3{background:rgba(109,93,252,.85)}
.formRow{display:grid;gap:6px;margin:12px 0}
label{font-size:12px;color:var(--muted);font-weight:900}
input[type="date"],select,textarea{width:100%;max-width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-size:14px;outline:none;display:block}
input[type="date"]{-webkit-appearance:none;appearance:none;text-align:center;line-height:1.2;height:54px;overflow:hidden}
input[type="date"]::-webkit-date-and-time-value{text-align:center;display:block;min-width:0}
input[type="date"]::-webkit-calendar-picker-indicator{margin:0;padding:0;opacity:.65}
.dateBox{width:100%;max-width:100%;min-width:0;height:54px;border:1px solid var(--line);background:var(--card);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0 10px}
.dateBox span{font-size:14px;font-weight:850;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.dateBox input[type="date"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2;padding:0;border:0;background:transparent;cursor:pointer}
textarea{min-height:92px;resize:vertical}
.btn{border:0;border-radius:16px;background:var(--primary);color:white;padding:12px 14px;font-weight:950;font-size:13px;width:100%;min-width:0}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.35)}
.formRow,.row2,.row2>*{min-width:0;max-width:100%}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 14px;border-radius:999px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 28px rgba(0,0,0,.28)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.smallLink{border:0;background:transparent;color:var(--primary);font-weight:900;font-size:12px;padding:0}
@media (max-width:360px){.app{padding-left:10px;padding-right:10px}h1{font-size:21px}.dday{font-size:30px}.grid3{gap:6px}.stat{padding:8px}.stat b{font-size:16px}}
@media (min-width:431px){body{background:#080a0f}.app{box-shadow:0 0 0 1px rgba(255,255,255,.08);}}

@media (max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .card{padding:15px}
  .dateBox{height:52px;padding:0 8px}
  .dateBox span{font-size:13px}
  input[type="date"]{font-size:13px;height:52px;padding:10px 8px}
  .row2{gap:7px}
}

/* ===== MILESTONE TIMELINE ===== */
.tlStrip{position:relative;height:56px;margin:6px 6px 2px}
.tlTrack{position:absolute;left:0;right:0;top:26px;height:3px;background:var(--card2);border-radius:999px}
.tlFill{position:absolute;left:0;top:26px;height:3px;background:linear-gradient(90deg,var(--success),var(--primary));border-radius:999px}
.tlToday{position:absolute;top:18px;width:2px;height:20px;background:var(--warning);border-radius:2px;transform:translateX(-50%)}
.tlDot{position:absolute;top:22px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card);transform:translateX(-50%);z-index:2}
.tlDot.done{background:var(--success);border-color:var(--success)}
.tlDot.future{background:var(--primary);border-color:var(--primary)}
.tlDot.exam{background:var(--danger);border-color:var(--danger);width:12px;height:12px;top:21px}
.tlLbl{position:absolute;top:38px;font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap;transform:translateX(-50%);line-height:1.3;text-align:center}
.tlLblTop{position:absolute;top:5px;font-size:9px;font-weight:900;color:var(--warning);white-space:nowrap;transform:translateX(-50%)}
.tlEdge{font-size:10px;font-weight:900;color:var(--muted)}
.tlEdgeRow{display:flex;justify-content:space-between;margin-top:4px}
.msGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.msCol{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:11px 12px}
.msColHead{font-size:11px;font-weight:950;color:var(--muted);letter-spacing:.04em;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px}
.msRow{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.msSubj{font-size:12px;font-weight:900;color:var(--text)}
.msVal{text-align:right}
.msDate{display:block;font-size:12px;font-weight:900;color:var(--primary)}
.msDday{display:block;font-size:10px;color:var(--muted);font-weight:800}
.msDone{display:block;font-size:11px;color:var(--success);font-weight:900}
.msNone{display:block;font-size:11px;color:var(--danger);font-weight:800}
.msBanner{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:11px 14px;margin-top:8px}
.msBanner.basic{border-color:rgba(109,93,252,.4);background:rgba(109,93,252,.09)}
.msBanner.practice{border-color:rgba(24,160,88,.35);background:rgba(24,160,88,.08)}
.msBannerName{font-size:13px;font-weight:900}
.msBannerDate{font-size:13px;font-weight:900;color:var(--primary)}
.msBannerDone{font-size:13px;font-weight:900;color:var(--success)}
/* ===== GIST SYNC ===== */
.gistStatus{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:800}
.gistDot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--card2);border:1px solid var(--line)}
.gistDot.ok{background:var(--success);border-color:var(--success)}
.gistDot.err{background:var(--danger);border-color:var(--danger)}
.gistDot.idle{background:var(--warning);border-color:var(--warning)}
.patWrap{position:relative}
.patWrap input[type="password"],.patWrap input[type="text"]{padding-right:46px}
.patToggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;padding:4px;line-height:1;cursor:pointer}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <div class="top">
    <div class="brand"><div class="kicker">국내 FRM · 2과목 면제 모드</div><h1>재무위험관리사<br>합격 플래너</h1></div>
    <button class="iconBtn" id="themeToggle" aria-label="테마 변경">🌙</button>
  </div>

  <main id="home" class="screen active"></main>
  <main id="plan" class="screen"></main>
  <main id="lectures" class="screen"></main>
  <main id="stats" class="screen"></main>
  <main id="settings" class="screen"></main>
</div>
<nav class="tabs" aria-label="하단 탭">
  <button class="tabBtn active" data-tab="home"><span class="ico">🏠</span><span>홈</span></button>
  <button class="tabBtn" data-tab="plan"><span class="ico">📅</span><span>계획</span></button>
  <button class="tabBtn" data-tab="lectures"><span class="ico">✅</span><span>강의</span></button>
  <button class="tabBtn" data-tab="stats"><span class="ico">📊</span><span>통계</span></button>
  <button class="tabBtn" data-tab="settings"><span class="ico">⚙️</span><span>설정</span></button>
</nav>

/* ══ GITHUB GIST AUTO-SYNC ══ */
function autoSyncGist() {
  if (!githubPAT) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => syncToGist(false), 3000);
}
async function syncToGist(isManual = false) {
  if (!githubPAT) { if (isManual) toast('GitHub Token을 먼저 설정해주세요.'); return; }
  if (isManual) toast('☁️ Gist에 저장 중...');
  const content = JSON.stringify(state, null, 2);
  const body = { description: 'FRM Planner Backup', public: false, files: { 'frm-planner-backup.json': { content } } };
  try {
    let url = 'https://api.github.com/gists';
    let method = 'POST';
    if (gistID) { url += '/' + gistID; method = 'PATCH'; }
    const res = await fetch(url, {
      method,
      headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${githubPAT}` },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!gistID) {
      gistID = data.id;
      try { localStorage.setItem('frm-gist-id', gistID); } catch(e) {}
    }
    lastGistSync = new Date().toISOString();
    try { localStorage.setItem('frm-gist-sync', lastGistSync); } catch(e) {}
    if (isManual) { toast('☁️ Gist 백업 완료!'); renderSettings(); }
    else { document.getElementById('gistSyncTime') && renderGistStatus(); }
  } catch(e) {
    console.error('Gist sync error:', e);
    if (isManual) toast('☁️ 백업 실패 — 토큰을 확인해주세요.');
  }
}
async function fetchFromGist() {
  if (!githubPAT || !gistID) { toast('Token과 Gist ID가 모두 필요합니다.'); return; }
  toast('☁️ 클라우드에서 불러오는 중...');
  try {
    const res = await fetch(`https://api.github.com/gists/${gistID}`, {
      headers: { 'Authorization': `token ${githubPAT}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const file = data.files['frm-planner-backup.json'];
    if (!file) throw new Error('백업 파일 없음');
    const parsed = JSON.parse(file.content);
    if (!confirm('클라우드 데이터로 복원할까요?\n현재 기기 데이터가 덮어씌워집니다.')) return;
    state = Object.assign(state, parsed);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    lastGistSync = new Date().toISOString();
    try { localStorage.setItem('frm-gist-sync', lastGistSync); } catch(e) {}
    renderAll();
    toast('📥 클라우드 복원 완료!');
  } catch(e) {
    console.error('Gist fetch error:', e);
    toast('복원 실패 — Gist ID 또는 토큰 확인');
  }
}
function saveGistConfig() {
  const pat = (document.getElementById('gistPAT')?.value || '').trim();
  const id  = (document.getElementById('gistID')?.value  || '').trim();
  githubPAT = pat;
  gistID    = id;
  try { localStorage.setItem('frm-gist-pat', pat); } catch(e) {}
  try { localStorage.setItem('frm-gist-id',  id);  } catch(e) {}
  toast('설정 저장됨');
  if (pat && !id) syncToGist(true);
  else renderSettings();
}
function togglePATVisibility() {
  const el = document.getElementById('gistPAT');
  const btn = document.getElementById('patToggleBtn');
  if (!el) return;
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}
function renderGistStatus() {
  const el = document.getElementById('gistSyncTime');
  if (!el) return;
  el.textContent = lastGistSync ? '마지막 동기화: ' + lastGistSync.slice(0,16).replace('T',' ') : '아직 동기화 없음';
}
/* ══════════════════════════ */
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function switchTab(tab) { currentTab=tab; document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===tab)); updateTabs(); window.scrollTo({top:0,behavior:'smooth'}); }
function updateTabs() { document.querySelectorAll('.tabBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab)); }
document.querySelectorAll('.tabBtn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.getElementById('themeToggle').addEventListener('click',()=>{ state.theme = state.theme==='dark'?'light':'dark'; saveState(); renderAll(); });
window.toggleDone=toggleDone; window.rebuildFromToday=rebuildFromToday; window.rebuildFromStart=rebuildFromStart; window.scrollToSettingsRest=scrollToSettingsRest; window.addRestDay=addRestDay; window.removeRestDay=removeRestDay; window.downloadBackup=downloadBackup; window.restoreBackup=restoreBackup; window.resetAll=resetAll; window.saveGistConfig=saveGistConfig; window.syncToGist=syncToGist; window.fetchFromGist=fetchFromGist; window.togglePATVisibility=togglePATVisibility;
renderAll();
</script>
